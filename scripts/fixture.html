<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>caliper capture fixture</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; color: #111; background: #fff; }

  /* Sticky chrome: capture.ts must hide this, or it overlaps every section
     that scrolls under it. */
  header {
    position: sticky; top: 0; height: 72px; background: #111; color: #fff;
    display: flex; align-items: center; padding: 0 32px; z-index: 10;
  }

  /* A running animation: capture.ts must zero it, or two runs of the same
     page produce two different screenshots. */
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(400px); } }
  .mover { animation: drift 2s linear infinite; width: 64px; height: 64px; background: #f97316; }

  section { padding: 48px 32px; }
  #hero { height: 1000px; background: #fafafa; }
  #pricing { height: 1000px; background: #fff; }
  #longpage { height: 5000px; background: #f4f4f5; }

  .title { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
  /* No descenders and no ascenders above the cap line, so the ink extent IS
     the cap height — the one case caps() measures exactly. */
  .allcaps { font-size: 40px; font-weight: 700; margin-top: 24px; }
  .card {
    margin-top: 40px; width: 480px; height: 220px;
    background: #fafafa; border: 3px solid #e9e9e9; border-radius: 12px;
  }
</style>
</head>
<body>
  <header>sticky chrome that must not appear in any shot</header>

  <section id="hero">
    <h1 class="title">Hero</h1>
    <div class="mover"></div>
  </section>

  <section id="pricing">
    <h2 class="title">Pricing</h2>
    <p class="allcaps">PLANS</p>
    <div class="card"></div>
  </section>

  <section id="longpage">
    <h2 class="title">A section too tall to fit the budget</h2>
  </section>
</body>
</html>
